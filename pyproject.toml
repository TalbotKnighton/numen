[project]
name = "numen"
version = "0.1.0"
description = "Hybrid Python/Julia simulation framework for engineering dynamics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "juliacall",
    "numpy",
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "fonttools>=4.62.1",
    "kiwisolver>=1.5.0",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "pyparsing>=3.3.2",
    "python-dateutil>=2.9.0.post0",
    "scipy>=1.17.1",
    "six>=1.17.0",
    "jax[cpu]>=0.10.0",
    "diffrax>=0.7.2",
    "tqdm>=4.67.3",
    "typer[all]>=0.25.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
examples = [
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
]
characterization = [
    "pyDOE3",
    "SALib",
    "pandas",
]

[project.scripts]
numen = "numen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numen"]
exclude = [
    "src/numen/examples/**/__pycache__",
    "src/numen/examples/**/*.pyc",
    "src/numen/examples/**/results.json",
    "src/numen/examples/**/*.png",
    "src/numen/examples/**/benchmark_results.txt",
    "src/numen/examples/**/.!*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
